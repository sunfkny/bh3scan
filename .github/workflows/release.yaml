name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish Windows executable
    permissions:
      contents: write # Creates the release and uploads bh3scan.exe.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Verify version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'bh3scan').version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match package version $version" }
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc -p bh3scan --bin bh3scan
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" target/x86_64-pc-windows-msvc/release/bh3scan.exe --verify-tag --title "$env:GITHUB_REF_NAME" --notes ""
