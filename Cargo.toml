[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
bh3scan-sign = { path = "crates/bh3scan-sign" }
bh3scan-mihoyo = { path = "crates/bh3scan-mihoyo" }
bh3scan-scanner = { path = "crates/bh3scan-scanner" }
bh3scan-bsgame = { path = "crates/bh3scan-bsgame" }
bh3scan-logger = { path = "crates/bh3scan-logger" }

base64 = "0.23"
hex = "0.4.3"
hmac = "0.13"
log = "0.4.28"
md-5 = "0.11"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
rsa = "0.10.0-rc.15"
serde = "1.0.228"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
clap = { version = "4.3.26", features = ["derive", "env"] }
rpassword = "7.0.1"
image = "0.25.10"
arboard = "3.6"
zedbar = "0.7"
xcap = "0.9.8"
directories = "6.0"
log4rs = "1.4.0"
url = "2.5.0"
webbrowser = "1.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = 'abort'
